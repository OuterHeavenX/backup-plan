name: Headless game tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        working-directory: tools
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the game's test scenes in headless Chromium
        run: tools/run_ci.sh
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-run
          path: |
            build/*.log
            build/*.png
